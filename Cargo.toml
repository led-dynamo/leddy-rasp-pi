[package]
name = "leddy-rasp-pi"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/led-dynamo/leddy-rasp-pi"

[dependencies]
futures-util = "0.3"
leddy-interfaces = { git = "https://github.com/led-dynamo/leddy-interfaces" }
leddy-lib = { git = "https://github.com/led-dynamo/leddy-lib" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
org = "led-dynamo"
name = "leddy-rasp-pi"
version = "0.1.0"
description = "Raspberry Pi display agent for WebSocket commands, rendering, telemetry, and hardware adapters"
license = "MIT"
keywords = ["led-matrix", "raspberry-pi", "edge", "iot", "rust"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/led-dynamo/leddy-rasp-pi"

[dependencies]
"led-dynamo/leddy-interfaces" = "^0.1.0"
"led-dynamo/leddy-lib" = "^0.1.0"

[build]
command = "cargo build --release"
outputs = ["target/release/leddy-rasp-pi"]

[bin]
leddy-rasp-pi = "target/release/leddy-rasp-pi"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/leddy-rasp-pi\""
exclude = [
  ".env",
  ".env.*",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/*.log",
]

[publish.native]
registry = "crates-io"
package = "leddy-rasp-pi"

[install]
adapter = "none"
dir = ".vendor/.zed"

[scripts]
test = "cargo test --all-targets"
